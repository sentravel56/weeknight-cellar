<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Weeknight Cellar — Top 10 Wines Under $25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EEEF; --ink:#2B1219; --muted:#7A6A6E; --line:#DCD1D4; --card:#FBF8F8;
    --accent:#8E1F33; --accent-soft:#F0DCE0;
  }
  body.theme-white{ --accent:#A87E14; --accent-soft:#F1E7CE; }
  body.theme-mixed{ --accent:#5E2750; --accent-soft:#E8DCE8; }
  *{box-sizing:border-box;margin:0;padding:0}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
  body{font-family:'Karla',sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px 80px}

  header{padding:56px 0 32px;border-bottom:1px solid var(--line)}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);transition:color .4s}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(34px,6vw,54px);line-height:1.05;margin:10px 0 12px}
  h1 em{font-style:italic;font-weight:400;color:var(--accent);transition:color .4s}
  .sub{color:var(--muted);max-width:56ch}

  .controls{padding:30px 0;border-bottom:1px solid var(--line)}
  .group-head{display:flex;align-items:baseline;gap:12px;margin:22px 0 9px;flex-wrap:wrap}
  .group-head:first-child{margin-top:0}
  .group-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .mini{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:none;border:none;border-bottom:1px solid var(--line);color:var(--accent);cursor:pointer;padding:0 0 1px;transition:border-color .2s}
  .mini:hover{border-color:var(--accent)}
  .mini:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:'Karla',sans-serif;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s,color .2s}
  .chip .box{width:13px;height:13px;border:1.5px solid var(--line);border-radius:3px;display:inline-block;position:relative;transition:border-color .2s,background .2s}
  .chip:hover{border-color:var(--accent)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip[aria-pressed="true"] .box{background:#fff;border-color:#fff}
  .chip[aria-pressed="true"] .box::after{content:'';position:absolute;left:3.5px;top:.5px;width:4px;height:8px;border:solid var(--accent);border-width:0 2px 2px 0;transform:rotate(45deg)}

  .slider-row{display:flex;align-items:center;gap:20px;margin:28px 0 6px;flex-wrap:wrap}
  .price-readout{font-family:'Fraunces',serif;font-weight:600;font-size:40px;min-width:112px}
  .price-readout small{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:220px;height:10px;border-radius:999px;background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--fill,60%),var(--line) var(--fill,60%));cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid var(--accent);box-shadow:0 2px 6px rgba(43,18,25,.25)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--accent);box-shadow:0 2px 6px rgba(43,18,25,.25)}
  input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}

  .results{padding-top:26px}
  .empty{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);padding:40px 0;text-align:center}
  .card{display:grid;grid-template-columns:44px 1fr auto;gap:5px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px}
  .rank{font-family:'Fraunces',serif;font-weight:600;font-size:26px;color:var(--accent);transition:color .4s}
  .wine-name{font-family:'Fraunces',serif;font-weight:600;font-size:20px;line-height:1.2}
  .varietal-line{grid-column:2;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .tag{grid-column:3;grid-row:1;align-self:start;font-family:'IBM Plex Mono',monospace;font-size:13px;white-space:nowrap;background:var(--accent-soft);padding:5px 10px;border-radius:6px;transition:background .4s}
  .notes{grid-column:2/4;font-size:15px;margin-top:4px}
  .stores{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
  .stores-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
  .store{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .disclaimer{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  @media (max-width:560px){
    .card{grid-template-columns:32px 1fr}
    .rank{font-size:20px}
    .tag{grid-column:2;grid-row:auto;justify-self:start}
    .varietal-line,.notes,.stores{grid-column:1/3}
  }
</style>
</head>

    <h1>The Weeknight <em>Cellar</em></h1>
    <p class="sub">One varietal, a few, or the whole rack. Set your ceiling and the list re-pours instantly &mdash; 110 bottles you can actually find on an American shelf.</p>

  <section class="controls" aria-label="Filters">
    <div class="group-head">
      <span class="group-label">Red wines</span>

      <button class="mini" data-none="red">None</button>

    <div class="group-head">

    </div>
    <p class="count" id="count"></p>
  </section>

  <section class="results" id="results" aria-live="polite"></section>
</div>

const REDS=["Pinot Noir","Merlot","Cabernet Sauvignon","Zinfandel","Syrah (Shiraz)","Red Wine Blend"];
const WHITES=["Chardonnay","Pinot Gris (Pinot Grigio)","Sauvignon Blanc","Riesling","White Wine Blend"];
const selected=new Set(["Pinot Noir"]);

function buildChips(list,el){
  list.forEach(v=>{
    const b=document.createElement('button');
    b.className='chip'; b.type='button'; b.dataset.v=v;
    b.innerHTML='<span class="box" aria-hidden="true"></span>'+v;
    b.addEventListener('click',()=>{selected.has(v)?selected.delete(v):selected.add(v);render();});
    el.appendChild(b);
  });
}
buildChips(REDS,document.getElementById('redChips'));
buildChips(WHITES,document.getElementById('whiteChips'));

document.querySelectorAll('.mini').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const on=btn.dataset.all,off=btn.dataset.none;
    const pick=g=>g==='red'?REDS:g==='white'?WHITES:REDS.concat(WHITES);
    if(on)pick(on).forEach(v=>selected.add(v));
    if(off)pick(off).forEach(v=>selected.delete(v));
    render();
  });
});

const slider=document.getElementById('price'),priceVal=document.getElementById('priceVal');
const results=document.getElementById('results'),countEl=document.getElementById('count');
slider.addEventListener('input',render);

function render(){
  // chip + theme state
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',selected.has(c.dataset.v)?'true':'false'));
  const hasRed=REDS.some(v=>selected.has(v)),hasWhite=WHITES.some(v=>selected.has(v));
  document.body.classList.toggle('theme-white',hasWhite&&!hasRed);
  document.body.classList.toggle('theme-mixed',hasWhite&&hasRed);

  const max=+slider.value;
  priceVal.textContent='$'+max;
  slider.style.setProperty('--fill',((max-slider.min)/(slider.max-slider.min))*100+'%');

  const chosen=REDS.concat(WHITES).filter(v=>selected.has(v));
  if(!chosen.length){
    countEl.textContent='';
    results.innerHTML='<p class="empty">Pick at least one varietal to pour a list.</p>';
    return;
  }

  // filter each varietal by price, keeping curated rank order
  const pools=chosen.map(v=>DATA[v].filter(w=>w[2]<=max).map(w=>({v:v,w:w})));
  // round-robin so multiple varietals share the ten slots
  const picks=[]; let i=0,more=true;
  while(picks.length<10&&more){
    more=false;
    for(const p of pools){ if(p[i]){picks.push(p[i]);more=true;if(picks.length===10)break;} }
    i++;
  }

  const total=pools.reduce((n,p)=>n+p.length,0);
  countEl.textContent=picks.length?('Showing '+picks.length+' of '+total+' matching bottles across '+chosen.length+' varietal'+(chosen.length>1?'s':'')):'';

  if(!picks.length){
    results.innerHTML='<p class="empty">Nothing under $'+max+' in that selection. Raise the ceiling or add a varietal.</p>';
    return;
  }

  const showVar=chosen.length>1;
  results.innerHTML=picks.map((p,n)=>{
    const w=p.w;
    return '<article class="card">'+
      '<div class="rank">'+(n+1)+'</div>'+
      '<div class="wine-name">'+esc(w[0])+'</div>'+
      '<div class="tag">'+esc(w[1])+' &middot; $'+w[2]+'</div>'+
      (showVar?'<div class="varietal-line">'+esc(p.v)+'</div>':'')+
      '<p class="notes">'+esc(w[3])+'</p>'+
      '<div class="stores"><span class="stores-label">Find it at</span>'+
        w[4].map(s=>'<span class="store">'+esc(s)+'</span>').join('')+
      '</div></article>';
  }).join('')+
  '<p class="disclaimer">Ranked best-first within each varietal; with several varietals selected the ten slots are shared evenly. Prices are typical US shelf prices and vary by state and store &mdash; expect a few dollars either way. Vintages rotate: if the year listed is gone, the next release is almost always the same wine. Curated July 2026.</p>';
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script>
</body>
</html>
